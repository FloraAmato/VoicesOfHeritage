services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    environment:
      - MODEL_TYPE=gbr

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
    environment:
      - VITE_BACKEND_URL=http://backend:8000
