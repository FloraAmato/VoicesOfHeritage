const { useEffect, useMemo, useState, useCallback, useRef } = React;

// ---------------------------------------------------------------------------

  [ENV_TYPES.BIBLIO]:   { T_media_24h:0.6, RH_media_30gg:0.7, dT_24h:0.7, dRH_24h:0.8, illuminamento:1.0, PM_VOC:0.6, gradiente_verticale_T:0.3, rischio_muffa_LIM:0.5, rischio_insetti:0.5 },
  [ENV_TYPES.DEPOSITO]: { T_media_24h:0.3, RH_media_30gg:0.9, dT_24h:0.2, dRH_24h:0.3, illuminamento:0.1, PM_VOC:0.5, gradiente_verticale_T:0.2, rischio_muffa_LIM:1.0, rischio_insetti:0.9 },
  [ENV_TYPES.SALA]:     { T_media_24h:0.8, RH_media_30gg:0.8, dT_24h:0.9, dRH_24h:1.0, illuminamento:0.9, PM_VOC:0.7, gradiente_verticale_T:1.0, rischio_muffa_LIM:0.7, rischio_insetti:0.8 },

const THRESH = {

  CO2:  { ottimale:[400,800], accettabile:[400,1000], attenzione:[400,1500] },
};

const RI_COEFS = { RI_Chimico:0.50, RI_Meccanico:0.10, RI_Insetti:0.25, RI_Muffa:0.15 };

// ---------------------------------------------------------------------------
// SEED
// ---------------------------------------------------------------------------
const ENVIRONMENTS = [
  { id:"ENV-ARM-01", nome:"Armadio climatizzato — Sala A", tipo:ENV_TYPES.ARMADIO,  inerzia:"alta" },
  { id:"ENV-BIB-01", nome:"Biblioteca di consultazione",   tipo:ENV_TYPES.BIBLIO,   inerzia:"media" },
  { id:"ENV-DEP-01", nome:"Deposito sotterraneo — Cripta", tipo:ENV_TYPES.DEPOSITO, inerzia:"alta" },
  { id:"ENV-SAL-01", nome:"Sala storica P.T. + Soppalco",  tipo:ENV_TYPES.SALA,     inerzia:"bassa" },
];

const MANUSCRIPTS = [
  { id:"MS-5463", nome:"Codex Beneventanus — Vat. lat. 5463", tipologia:"pergamena", pH:6.2, DP0:1100, ferroGallico:true, fotosensibili:false, legatura:"restaurato", deformazioni:1, fragilita:1, alterazioni:1, frequenza:"rara", ambienteId:"ENV-ARM-01", quota:"piano_terra", paretEsterna:false, sole:false },
  { id:"MS-0428", nome:"Virgili Beneventani — frammento Aen.", tipologia:"pergamena", pH:5.8, DP0:950, ferroGallico:true, fotosensibili:true, legatura:"fragile", deformazioni:2, fragilita:2, alterazioni:2, frequenza:"rara", ambienteId:"ENV-ARM-01", quota:"piano_terra", paretEsterna:false, sole:false },
  { id:"MS-1190", nome:"Pontificale di Beneventum — XII sec.", tipologia:"pergamena", pH:6.5, DP0:1300, ferroGallico:true, fotosensibili:true, legatura:"buono", deformazioni:0, fragilita:1, alterazioni:1, frequenza:"occasionale", ambienteId:"ENV-BIB-01", quota:"piano_terra", paretEsterna:false, sole:true },
  { id:"MS-2310", nome:"Antifonario miniato — XIV sec.", tipologia:"pergamena", pH:6.0, DP0:1050, ferroGallico:false, fotosensibili:true, legatura:"buono", deformazioni:1, fragilita:1, alterazioni:2, frequenza:"frequente", ambienteId:"ENV-BIB-01", quota:"piano_terra", paretEsterna:true, sole:true },
  { id:"MS-7811", nome:"Cartulario di S. Sofia — XI sec.", tipologia:"pergamena", pH:5.5, DP0:850, ferroGallico:true, fotosensibili:false, legatura:"compromesso", deformazioni:2, fragilita:3, alterazioni:2, frequenza:"rara", ambienteId:"ENV-DEP-01", quota:"piano_terra", paretEsterna:true, sole:false },
  { id:"MS-9245", nome:"Liber Confraternitatis — XVII sec.", tipologia:"carta_acida", pH:4.6, DP0:520, ferroGallico:true, fotosensibili:false, legatura:"fragile", deformazioni:2, fragilita:3, alterazioni:3, frequenza:"rara", ambienteId:"ENV-DEP-01", quota:"piano_terra", paretEsterna:true, sole:false },
  { id:"MS-3340", nome:"Codex liturgicus — XV sec.", tipologia:"pergamena", pH:6.3, DP0:1200, ferroGallico:true, fotosensibili:true, legatura:"restaurato", deformazioni:1, fragilita:1, alterazioni:1, frequenza:"occasionale", ambienteId:"ENV-SAL-01", quota:"piano_terra", paretEsterna:false, sole:true },
  { id:"MS-3341", nome:"Diario capitolare — XVIII sec. (soppalco)", tipologia:"carta_stracciata", pH:6.8, DP0:1400, ferroGallico:false, fotosensibili:false, legatura:"buono", deformazioni:0, fragilita:1, alterazioni:1, frequenza:"occasionale", ambienteId:"ENV-SAL-01", quota:"soppalco", paretEsterna:true, sole:true },
];

const PROFILES = {
  [ENV_TYPES.ARMADIO]:  { Tm:20, Tas:1.0, Tad:0.3, Tn:0.08, RHm:50, RHas:3, RHad:0.8, RHn:0.4, luxDay:0, luxH:[0,0], voc:180, vocDrift:2.5, pm10:4, co2:500, inertia:0.96, soppT:0, soppRH:0 },
  [ENV_TYPES.BIBLIO]:   { Tm:21, Tas:2.5, Tad:1.0, Tn:0.18, RHm:50, RHas:6, RHad:2.5, RHn:1.0, luxDay:180, luxH:[9,18], voc:250, vocDrift:0, pm10:18, co2:700, inertia:0.80, soppT:0, soppRH:0 },
  [ENV_TYPES.DEPOSITO]: { Tm:16, Tas:0.6, Tad:0.1, Tn:0.05, RHm:68, RHas:5, RHad:0.5, RHn:0.6, luxDay:0, luxH:[0,0], voc:150, vocDrift:0, pm10:8, co2:550, inertia:0.97, soppT:0, soppRH:0 },
  [ENV_TYPES.SALA]:     { Tm:20, Tas:5, Tad:2, Tn:0.25, RHm:50, RHas:12, RHad:4, RHn:1.5, luxDay:120, luxH:[8,19], voc:200, vocDrift:0, pm10:22, co2:600, inertia:0.70, soppT:2.0, soppRH:-6.5 },
};

// ---------------------------------------------------------------------------
// SIMULATORE
// ---------------------------------------------------------------------------
function mulberry32(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function randn(rand){ const u = Math.max(1e-9, rand()), v = rand(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

class Simulator {
  constructor(envId, type, seed) {
    this.envId = envId; this.type = type; this.profile = PROFILES[type];
    this.rand = mulberry32(seed);
    this.tState = null; this.rhState = null;
    this.tStateSop = null; this.rhStateSop = null;
    this.vocState = this.profile.voc;
    this.scenario = "none"; this.scenarioStart = null; this.scenarioDur = 72*3600*1000;
    this.now = new Date();
  }
  triggerScenario(s, hours) { this.scenario = s; this.scenarioStart = new Date(this.now); this.scenarioDur = (hours||72)*3600*1000; }
  resetScenario() { this.scenario = "none"; this.scenarioStart = null; }
  scenarioActive(ts) { return this.scenario !== "none" && this.scenarioStart && (ts - this.scenarioStart) <= this.scenarioDur; }
  scenarioProgress(ts) { if (!this.scenarioActive(ts)) return 0; return Math.min(1, Math.max(0, (ts - this.scenarioStart)/this.scenarioDur)); }
  seasonal(ts, amp, mean) { const start = new Date(ts.getFullYear(),0,0); const doy = Math.floor((ts - start)/86400000); return mean + amp*Math.sin(2*Math.PI*(doy-110)/365); }
  diurnal(ts, amp) { const h = ts.getHours()+ts.getMinutes()/60; return amp*Math.sin(2*Math.PI*(h-8)/24); }
  ar1(prev, target, alpha, noise) { if (prev===null) return target + randn(this.rand)*noise; return alpha*prev + (1-alpha)*target + randn(this.rand)*noise; }
  isOpen(ts) { const a = this.profile.luxH[0], b = this.profile.luxH[1]; if (a===b) return false; return ts.getHours()>=a && ts.getHours()<b && ts.getDay()!==0; }
  step(stepMin) {
    stepMin = stepMin || 10;
    const ts = new Date(this.now); this.now = new Date(this.now.getTime() + stepMin*60000);
    const p = this.profile;
    let Tt = this.seasonal(ts, p.Tas, p.Tm) + this.diurnal(ts, p.Tad);
    let RHt = this.seasonal(ts, -p.RHas, p.RHm) + this.diurnal(ts, -p.RHad);
    let luxExtra = 0, vocExtra = 0;

    if (this.type === ENV_TYPES.ARMADIO && this.rand() < 0.002) vocExtra += 80;
    if (this.type === ENV_TYPES.BIBLIO && this.isOpen(ts) && Math.floor(ts/86400000)%5===0) { Tt += 0.6; RHt += 1.5; }
    if (this.type === ENV_TYPES.DEPOSITO && (Math.floor(ts/86400000)*13+7)%100 < 4) {
      const h = ts.getHours()+ts.getMinutes()/60; if (h>4 && h<16) RHt += 4*Math.sin(Math.PI*(h-4)/12);
    }

    if (this.scenarioActive(ts)) {
      const prog = this.scenarioProgress(ts);
      if (this.scenario === "A" && this.type === ENV_TYPES.DEPOSITO) RHt += 9*prog;
      if (this.scenario === "B" && this.type === ENV_TYPES.SALA) {
        const h = ts.getHours()+ts.getMinutes()/60; Tt += 3*Math.sin(2*Math.PI*h/6)*(0.5+0.5*prog);
      }
      if (this.scenario === "C" && this.type === ENV_TYPES.ARMADIO) vocExtra += 1000*prog;
      if (this.scenario === "D" && this.type === ENV_TYPES.BIBLIO && this.isOpen(ts)) luxExtra += 200*(0.5+0.5*prog);
    }

    const T = this.ar1(this.tState, Tt, p.inertia, p.Tn);
    const RH = this.ar1(this.rhState, RHt, p.inertia, p.RHn);
    this.tState = T; this.rhState = RH;

    let lux = 0;
    if (this.isOpen(ts)) lux = p.luxDay * (0.7 + 0.6*this.rand()) + luxExtra; else lux = luxExtra;
    lux = Math.max(0, lux);
    const UV = lux*0.05;
    this.vocState = Math.max(50, this.vocState + p.vocDrift*(stepMin/1440) + randn(this.rand)*5);
    if (ts.getDay()===1 && ts.getHours()===9 && ts.getMinutes()<stepMin) this.vocState = Math.max(50, this.vocState*0.6);
    const VOC = this.vocState + vocExtra;
    const PM10 = Math.max(0, p.pm10 + randn(this.rand)*3);
    const PM25 = PM10*0.55;
    const CO2 = p.co2 + (this.isOpen(ts)?200:0) + randn(this.rand)*30;

    const base = {
      timestamp: ts.toISOString(), environment_id: this.envId,
      T:+T.toFixed(3), RH:+RH.toFixed(2), lux:+lux.toFixed(1), UV:+UV.toFixed(2),
      PM2_5:+PM25.toFixed(2), PM10:+PM10.toFixed(2), VOC:+VOC.toFixed(1), CO2:+CO2.toFixed(1),
      quota: null
    };
    if (this.type === ENV_TYPES.SALA) {
      base.quota = "piano_terra";
      let offT = p.soppT, offRH = p.soppRH;
      if (this.scenario === "E" && this.scenarioActive(ts)) offT += 0.8*this.scenarioProgress(ts);
      const TtS = Tt + offT, RHtS = RHt + offRH;
      const TS = this.ar1(this.tStateSop, TtS, p.inertia, p.Tn);
      const RHS = this.ar1(this.rhStateSop, RHtS, p.inertia, p.RHn);
      this.tStateSop = TS; this.rhStateSop = RHS;
      const sop = Object.assign({}, base, { T:+TS.toFixed(3), RH:+RHS.toFixed(2), quota:"soppalco" });
      return [base, sop];
    }
    return [base];
  }
}

// ---------------------------------------------------------------------------
// INDICI DI RISCHIO
// ---------------------------------------------------------------------------
const clip100 = x => Math.max(0, Math.min(100, x));
const fpH = pH => 0.55 + (0.72-0.55)*(pH-5)/2;
const sedlbauer = T => T<=5?95: T>=35?70: 75-0.4*(T-20);
function brimblecombe(T, RH) { if (RH<=50) return 0; const eT=1560*Math.exp(-((T-29)*(T-29))/(2*16)); const eR=Math.exp(-((RH-70)*(RH-70))/(2*100)); return eT*eR; }
function labelFromRI(ri){ if (ri<20) return 0; if (ri<35) return 1; if (ri<50) return 2; return 3; }
function severityFromRI(v){ if (v>=50) return "critico"; if (v>=35) return "attenzione"; if (v>=20) return "accettabile"; return "ottimale"; }

function aggregate(samples) {
  if (!samples.length) return { Tm24:20, Tm30:20, RHm24:50, RHm30:50, dT24:0, dRH24:0, dRH30:0, luxMean:0, luxCum5y:0, VOC24:0, PM10_24:0, oreLIM:0, fracEN:0 };
  const last24 = Math.min(samples.length, 144);
  const T = samples.map(s=>s.T), RH = samples.map(s=>s.RH);
  const lux = samples.map(s=>s.lux), VOC = samples.map(s=>s.VOC), PM = samples.map(s=>s.PM10);
  const T24 = T.slice(-last24), RH24 = RH.slice(-last24);
  const mean = a => a.reduce((x,y)=>x+y,0)/Math.max(1,a.length);
  const Tm30 = mean(T), RHm30 = mean(RH);
  const luxAct = lux.filter(x=>x>1);
  const luxMean = luxAct.length? mean(luxAct):0;
  const duty = lux.filter(x=>x>1).length / Math.max(1,lux.length);
  const luxCum5y = luxMean*duty*24*365*5;
  let over = 0;
  for (let i=0;i<T.length;i++) if (RH[i] > sedlbauer(T[i])) over++;
  const oreLIM = over/Math.max(1,T.length)*8760;
  const bandT = [Tm30-1.5, Tm30+1.5], bandRH = [RHm30-3, RHm30+3];
  const outT = T.filter(x=>x<bandT[0]||x>bandT[1]).length/T.length;
  const outRH = RH.filter(x=>x<bandRH[0]||x>bandRH[1]).length/RH.length;
  return {
    Tm24: mean(T24), Tm30, RHm24: mean(RH24), RHm30,
    dT24: Math.max.apply(null,T24)-Math.min.apply(null,T24),
    dRH24: Math.max.apply(null,RH24)-Math.min.apply(null,RH24),
    dRH30: Math.max.apply(null,RH)-Math.min.apply(null,RH),
    luxMean, luxCum5y,
    VOC24: mean(VOC.slice(-last24)), PM10_24: mean(PM.slice(-last24)),
    oreLIM, fracEN: Math.max(outT, outRH),
  };
}

function computeIndices(feat, ms, envType, weightsOverride) {
  const w = weightsOverride || WEIGHTS[envType];
  const arr = Math.pow(2, (feat.Tm30-20)/10);
  const baseChem = 100*(1 - fpH(ms.pH));
  const dp0Factor = Math.max(0.4, Math.min(1.6, 800/Math.max(50, ms.DP0)));
  const ironGall = ms.ferroGallico ? 1.25 : 1.0;
  const vocTerm = (feat.VOC24/1000)*w.PM_VOC;
  const pmTerm = (feat.PM10_24/75)*w.PM_VOC;
  const chim = clip100(baseChem*arr*dp0Factor*ironGall*(1+0.3*w.T_media_24h*(arr-1))*(1+0.2*(vocTerm+pmTerm)));
  const fluct = (feat.dT24/4)*w.dT_24h + (feat.dRH24/12)*w.dRH_24h;
  const fragF = 1 + 0.25*ms.fragilita;
  const mecc = clip100(feat.fracEN*100*fragF*(1+0.5*fluct));
  const eggs = brimblecombe(feat.Tm30, feat.RHm30);
  const ins = clip100((100*eggs/1560)*(1+0.3*(w.rischio_insetti-0.5)));
  const muf = clip100((100*feat.oreLIM/8760)*(1+0.3*(w.rischio_muffa_LIM-0.5)));
  const sens = ms.fotosensibili ? 2.0 : 1.0;
  let dE = sens*(feat.luxCum5y/1e6)*5;
  dE *= 0.6 + 0.4*w.illuminamento;
  const fot = Math.max(0, Math.min(130, dE));
  const tot = clip100(RI_COEFS.RI_Chimico*chim + RI_COEFS.RI_Meccanico*mecc + RI_COEFS.RI_Insetti*ins + RI_COEFS.RI_Muffa*muf);
  return { RI_Chimico:+chim.toFixed(2), RI_Meccanico:+mecc.toFixed(2), RI_Insetti:+ins.toFixed(2), RI_Muffa:+muf.toFixed(2), RI_Fotodeterioramento:+fot.toFixed(2), RI_Totale:+tot.toFixed(2), severity: severityFromRI(tot) };
}

// ---------------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------------
const STATE = {
  simulators: {}, telemetry: {}, indicesHist: {}, alerts: [],
  weights: JSON.parse(JSON.stringify(WEIGHTS)),
  listeners: new Set(), lastEmitted: {},
};

function notify() { STATE.listeners.forEach(fn => fn()); }

function bootstrap() {
  ENVIRONMENTS.forEach(env => {
    let seed = 0; for (let i=0;i<env.id.length;i++) seed = (seed*31 + env.id.charCodeAt(i))|0;
    STATE.simulators[env.id] = new Simulator(env.id, env.tipo, Math.abs(seed)+1);
    STATE.telemetry[env.id] = [];
  });
  // Pre-genera 30 giorni a 10 min = 4320 step
  const STEPS = 30 * 144;
  ENVIRONMENTS.forEach(env => {
    const sim = STATE.simulators[env.id];
    sim.now = new Date(Date.now() - STEPS*10*60000);
    for (let i = 0; i < STEPS; i++) {
      const out = sim.step(10);
      for (let j=0;j<out.length;j++) STATE.telemetry[env.id].push(out[j]);
    }
  });
  MANUSCRIPTS.forEach(m => { STATE.indicesHist[m.id] = []; });
}

function tickLive() {
  ENVIRONMENTS.forEach(env => {
    const sim = STATE.simulators[env.id];
    for (let i = 0; i < 6; i++) {
      const out = sim.step(10);
      for (let j=0;j<out.length;j++) {
        STATE.telemetry[env.id].push(out[j]);
        if (STATE.telemetry[env.id].length > 8000) STATE.telemetry[env.id].shift();
      }
    }
  });
  MANUSCRIPTS.forEach(m => {
    const idx = computeForManuscript(m.id);
    STATE.indicesHist[m.id].push(Object.assign({}, idx, { ts: new Date().toISOString() }));
    if (STATE.indicesHist[m.id].length > 500) STATE.indicesHist[m.id].shift();
    maybeEmitAlert(m, idx);
  });
  notify();
}

function getMSSeries(ms, limit) {
  limit = limit || 4320;
  const env = ENVIRONMENTS.find(e=>e.id===ms.ambienteId);
  const all = STATE.telemetry[ms.ambienteId] || [];
  const filt = env.tipo === ENV_TYPES.SALA ? all.filter(s=>s.quota===ms.quota) : all;
  return filt.slice(-limit);
}

function computeForManuscript(msId, weightsOverride, telemetryOverride) {
  const m = MANUSCRIPTS.find(x=>x.id===msId);
  const env = ENVIRONMENTS.find(e=>e.id===m.ambienteId);
  const series = telemetryOverride || getMSSeries(m);
  const feat = aggregate(series);
  const w = weightsOverride || STATE.weights[env.tipo];
  return computeIndices(feat, m, env.tipo, w);
}

function predictForManuscript(msId) {
  const idx = computeForManuscript(msId);
  const hist = STATE.indicesHist[msId] || [];
  const last = hist.slice(-50);
  let rate = 0;
  if (last.length >= 5) {
    const xs = last.map((_,i)=>i), ys = last.map(h=>h.RI_Totale);
    const mx = xs.reduce((a,b)=>a+b,0)/xs.length;
    const my = ys.reduce((a,b)=>a+b,0)/ys.length;
    let num = 0, den = 0;
    for (let i=0;i<xs.length;i++) { num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)*(xs[i]-mx); }
    if (den > 0) rate = (num/den) * 24;
  }
  if (rate <= 0.01) rate = Math.max(0.01, (50 - idx.RI_Totale) / 60);
  const RUT = idx.RI_Totale >= 50 ? 0 : Math.min(365, (50 - idx.RI_Totale) / Math.max(0.01, rate));
  const conformalQ = 5;
  const traj = [];
  for (let d=1; d<=30; d++) {
    const ri = Math.min(100, idx.RI_Totale + rate*d);
    const spread = (conformalQ/30)*d*2;
    traj.push({ t: d, RI_pred: +ri.toFixed(2), lower: +Math.max(0,ri-spread).toFixed(2), upper: +Math.min(100,ri+spread).toFixed(2) });
  }
  return { current_RI: idx.RI_Totale, predicted_RI_30d: traj[traj.length-1].RI_pred, RUT_A_days: RUT, RUT_A_lower: Math.max(0,RUT-conformalQ), RUT_A_upper: RUT+conformalQ, trajectory: traj, cluster: labelFromRI(idx.RI_Totale) };
}

function maybeEmitAlert(m, idx) {
  let sev = null;
  if (idx.RI_Totale >= 60) sev = "CRITICA";
  else if (idx.RI_Totale >= 50) sev = "ALTA";
  else if (idx.RI_Totale >= 35) sev = "MEDIA";
  else return;
  const key = m.id + "-" + sev;
  const now = Date.now();
  if (STATE.lastEmitted[key] && (now - STATE.lastEmitted[key]) < 30000) return;
  STATE.lastEmitted[key] = now;
  const last = (STATE.telemetry[m.ambienteId].length ? STATE.telemetry[m.ambienteId][STATE.telemetry[m.ambienteId].length-1] : null);
  let trigVar = "RI_Totale", trigVal = idx.RI_Totale, trigMsg = "RI Totale elevato (" + idx.RI_Totale.toFixed(1) + "%)";
  if (last) {
    const cands = [["RH",last.RH],["T",last.T],["VOC",last.VOC],["lux",last.lux]];
    for (let i=0;i<cands.length;i++) {
      const k = cands[i][0], v = cands[i][1], t = THRESH[k];
      if (!t) continue;
      if (v < t.attenzione[0] || v > t.attenzione[1]) {
        trigVar = k; trigVal = v; trigMsg = k + " fuori soglia di attenzione (" + v.toFixed(1) + ")"; break;
      }
    }
  }
  STATE.alerts.unshift({
    id: "AL-" + Math.random().toString(36).slice(2,10).toUpperCase(),
    timestamp: new Date().toISOString(), severity: sev,
    manuscript_id: m.id, environment_id: m.ambienteId,
    trigger_variable: trigVar, trigger_value: trigVal, RI_Totale: idx.RI_Totale,
    message: trigMsg, status: "aperto", note: null,
  });
  if (STATE.alerts.length > 200) STATE.alerts.pop();
}

function pad(n) { return n < 10 ? "0"+n : ""+n; }
function fmtTs(iso) { const d = new Date(iso); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmtTime(iso) { const d = new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); }

function TimeSeriesChart({ samples, dataKey, color, height, threshold, unit }) {
  const W = 800, H = height || 160, padL = 40, padR = 10, padT = 10, padB = 20;
  if (!samples.length) return <svg width="100%" viewBox={`0 0 ${W} ${H}`}/>;
  const vals = samples.map(s => s[dataKey]);
  let yMin = Math.min.apply(null, vals), yMax = Math.max.apply(null, vals);
  if (threshold) { yMin = Math.min(yMin, threshold.attenzione[0]); yMax = Math.max(yMax, threshold.attenzione[1]); }
  if (yMax - yMin < 0.1) { yMin -= 1; yMax += 1; }
  const yPad = (yMax - yMin) * 0.05;
  yMin -= yPad; yMax += yPad;
  const xScale = i => padL + (W - padL - padR) * (i / Math.max(1, samples.length - 1));
  const yScale = v => padT + (H - padT - padB) * (1 - (v - yMin) / Math.max(0.001, yMax - yMin));
  const yScaleClip = v => Math.max(padT, Math.min(H - padB, yScale(v)));

  const points = samples.map((s, i) => xScale(i) + "," + yScale(s[dataKey])).join(" ");
  const breaches = [];
  if (threshold) {
    samples.forEach((s, i) => {
      const v = s[dataKey];
      if (v < threshold.attenzione[0] || v > threshold.attenzione[1]) breaches.push({ x: xScale(i), y: yScale(v) });
    });
  }
  const ticks = 5;
  const yTicks = []; for (let i=0;i<=ticks;i++) yTicks.push(yMin + (yMax - yMin) * i / ticks);
  const xLabelEvery = Math.max(1, Math.floor(samples.length / 8));

  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{maxHeight: H+"px"}}>
      {threshold && (
        <g>
          <rect x={padL} y={yScaleClip(threshold.ottimale[1])} width={W-padL-padR} height={Math.max(0, yScaleClip(threshold.ottimale[0]) - yScaleClip(threshold.ottimale[1]))} fill="#16a34a" fillOpacity="0.07"/>
          <rect x={padL} y={yScaleClip(threshold.attenzione[1])} width={W-padL-padR} height={Math.max(0, yScaleClip(threshold.attenzione[0]) - yScaleClip(threshold.attenzione[1]))} fill="#f59e0b" fillOpacity="0.06"/>
        </g>
      )}
      {yTicks.map((v, i) => (
        <g key={i}>
          <line x1={padL} x2={W-padR} y1={yScale(v)} y2={yScale(v)} stroke="#e2e8f0" strokeDasharray="2,2"/>
          <text x={padL-4} y={yScale(v)+3} textAnchor="end" fontSize="9" fill="#64748b">{v.toFixed(1)}</text>
        </g>
      ))}
      <polyline fill="none" stroke={color} strokeWidth="1.5" points={points}/>
      {breaches.map((b, i) => (
        <polygon key={i} points={`${b.x-3},${b.y+3} ${b.x+3},${b.y+3} ${b.x},${b.y-3}`} fill="#000"/>
      ))}
      {samples.filter((_, i) => i % xLabelEvery === 0).map((s, i) => (
        <text key={i} x={xScale(i*xLabelEvery)} y={H-5} textAnchor="middle" fontSize="9" fill="#64748b">{fmtTime(s.timestamp)}</text>
      ))}
    </svg>
  );
}

function RadarChart({ data, size }) {
  const S = size || 240, cx = S/2, cy = S/2, R = S/2 - 30;
  if (!data.length) return null;
  const N = data.length;
  const angle = i => -Math.PI/2 + 2*Math.PI*i/N;
  const xy = (i, r) => [cx + r*Math.cos(angle(i)), cy + r*Math.sin(angle(i))];
  const ringLevels = [0.25, 0.5, 0.75, 1.0];
  const polyPoints = data.map((d, i) => {
    const r = R * Math.max(0, Math.min(1, d.value/100));
    const p = xy(i, r); return p[0] + "," + p[1];
  }).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${S} ${S}`} style={{maxHeight: S+"px"}}>
      {ringLevels.map((lvl, i) => {
        const pts = data.map((_, j) => { const p = xy(j, R*lvl); return p[0]+","+p[1]; }).join(" ");
        return <polygon key={i} points={pts} fill="none" stroke="#cbd5e1" strokeDasharray="2,2"/>;
      })}
      {data.map((d, i) => {
        const p = xy(i, R);
        return <line key={i} x1={cx} y1={cy} x2={p[0]} y2={p[1]} stroke="#cbd5e1"/>;
      })}
      <polygon points={polyPoints} fill="#0f172a" fillOpacity="0.3" stroke="#0f172a" strokeWidth="1.5"/>
      {data.map((d, i) => {
        const p = xy(i, R + 14);
        return <text key={i} x={p[0]} y={p[1]} textAnchor="middle" dominantBaseline="middle" fontSize="11" fill="#475569">{d.metric}</text>;
      })}
    </svg>
  );
}

function TrajectoryChart({ past, future, height }) {
  const W = 800, H = height || 280, padL = 40, padR = 10, padT = 20, padB = 30;
  const all = past.concat(future);
  if (!all.length) return <svg width="100%" viewBox={`0 0 ${W} ${H}`}/>;
  const xMin = -past.length, xMax = future.length;
  const xScale = x => padL + (W - padL - padR) * (x - xMin) / Math.max(1, xMax - xMin);
  const yScale = v => padT + (H - padT - padB) * (1 - v/100);
  const pastPts = past.map((p, i) => xScale(-past.length + i) + "," + yScale(p.RI)).join(" ");
  const futurePts = future.map(p => xScale(p.t) + "," + yScale(p.RI_pred)).join(" ");
  // Banda
  const bandTop = future.map(p => xScale(p.t) + "," + yScale(p.upper));
  const bandBottom = future.slice().reverse().map(p => xScale(p.t) + "," + yScale(p.lower));
  const bandPts = bandTop.concat(bandBottom).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{maxHeight: H+"px"}}>
      <line x1={xScale(0)} x2={xScale(0)} y1={padT} y2={H-padB} stroke="#94a3b8" strokeDasharray="3,3"/>
      <text x={xScale(0)+4} y={padT+10} fontSize="9" fill="#64748b">oggi</text>
      {[0,25,50,75,100].map((v,i) => (
        <g key={i}>
          <line x1={padL} x2={W-padR} y1={yScale(v)} y2={yScale(v)} stroke="#e2e8f0" strokeDasharray="2,2"/>
          <text x={padL-4} y={yScale(v)+3} textAnchor="end" fontSize="9" fill="#64748b">{v}</text>
        </g>
      ))}
      <line x1={padL} x2={W-padR} y1={yScale(35)} y2={yScale(35)} stroke="#f59e0b" strokeDasharray="4,2"/>
      <line x1={padL} x2={W-padR} y1={yScale(50)} y2={yScale(50)} stroke="#dc2626" strokeDasharray="4,2"/>
      <text x={W-padR-4} y={yScale(35)-3} textAnchor="end" fontSize="9" fill="#f59e0b">attenzione 35%</text>
      <text x={W-padR-4} y={yScale(50)-3} textAnchor="end" fontSize="9" fill="#dc2626">critica 50%</text>
      <polygon points={bandPts} fill="#0ea5e9" fillOpacity="0.15"/>
      {pastPts && <polyline fill="none" stroke="#0f172a" strokeWidth="2" points={pastPts}/>}
      {futurePts && <polyline fill="none" stroke="#0ea5e9" strokeWidth="2" strokeDasharray="4,2" points={futurePts}/>}
      <text x={padL} y={H-8} fontSize="9" fill="#64748b">{xMin} gg</text>
      <text x={W-padR} y={H-8} textAnchor="end" fontSize="9" fill="#64748b">+{xMax} gg</text>
    </svg>
  );
}

const CLUSTER_COLORS = ["#16a34a","#84cc16","#f59e0b","#dc2626"];

function ClusterScatter({ points, current }) {
  const W = 800, H = 320, padL = 50, padR = 10, padT = 20, padB = 40;
  if (!points.length) return <svg width="100%" viewBox={`0 0 ${W} ${H}`}><text x={W/2} y={H/2} textAnchor="middle" fill="#94a3b8">Cronologia in popolamento...</text></svg>;
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const xMin = Math.min.apply(null,xs), xMax = Math.max.apply(null,xs);
  const yMin = Math.min.apply(null,ys), yMax = Math.max.apply(null,ys);
  const xS = v => padL + (W-padL-padR)*(v-xMin)/Math.max(0.01,xMax-xMin);
  const yS = v => padT + (H-padT-padB)*(1-(v-yMin)/Math.max(0.01,yMax-yMin));
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{maxHeight: H+"px"}}>
      {[0,1].map(i => <line key={"hg"+i} x1={padL+i*(W-padL-padR)} x2={padL+i*(W-padL-padR)} y1={padT} y2={H-padB} stroke="#e2e8f0"/>)}
      <line x1={padL} x2={W-padR} y1={H-padB} y2={H-padB} stroke="#94a3b8"/>
      <line x1={padL} x2={padL} y1={padT} y2={H-padB} stroke="#94a3b8"/>
      {points.map((p,i) => <circle key={i} cx={xS(p.x)} cy={yS(p.y)} r="4" fill={CLUSTER_COLORS[p.cluster]} fillOpacity="0.6"/>)}
      {current && <polygon points={`${xS(current.x)},${yS(current.y)-8} ${xS(current.x)+7},${yS(current.y)+5} ${xS(current.x)-7},${yS(current.y)+5}`} fill="#000"/>}
      <text x={W/2} y={H-10} textAnchor="middle" fontSize="10" fill="#64748b">RI Chimico (%)</text>
      <text x={12} y={H/2} textAnchor="middle" fontSize="10" fill="#64748b" transform={`rotate(-90 12 ${H/2})`}>RI Insetti (%)</text>
      {[0,1,2,3].map(c => (
        <g key={c} transform={`translate(${padL + c*100} 12)`}>
          <circle cx="0" cy="0" r="4" fill={CLUSTER_COLORS[c]}/>
          <text x="8" y="3" fontSize="10" fill="#475569">Cluster {c}</text>
        </g>
      ))}
    </svg>
  );
}

          <div className="flex justify-between items-baseline mb-2">
            <div className="text-sm font-semibold text-slate-700 uppercase tracking-wide">{c.label}</div>
            {c.thr && <div className="text-xs text-slate-500">Ottimale {c.thr.ottimale.join("–")} · Attenzione fuori da {c.thr.attenzione.join("–")}</div>}
          </div>
          <TimeSeriesChart samples={samples} dataKey={c.key} color={c.color} threshold={c.thr}/>
        </div>
      ))}

      <div className="rounded-xl border border-slate-200 bg-white shadow-sm p-4">
        <div className="text-sm font-semibold text-slate-700 uppercase tracking-wide mb-2">Box-plot stratificato per cluster</div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
          {["T","RH","VOC","PM10"].map(k => {
            const arr = samples.map(s=>s[k]).slice().sort((a,b)=>a-b);
            if (!arr.length) return null;
            const q = p => arr[Math.min(arr.length-1, Math.floor(p*arr.length))];
            const min=arr[0], max=arr[arr.length-1], q1=q(0.25), med=q(0.5), q3=q(0.75);
            return (
              <div key={k} className="bg-slate-50 rounded-md p-3">
                <div className="font-semibold text-slate-700 mb-1">{k}</div>
                <div className="text-slate-500">min {min.toFixed(1)} · max {max.toFixed(1)}</div>
                <div className="mt-2 h-3 bg-slate-200 rounded-sm relative">
                  <div className="absolute inset-y-0 bg-slate-400" style={{left:((q1-min)/Math.max(0.01,max-min)*100)+"%", right:((1-(q3-min)/Math.max(0.01,max-min))*100)+"%"}}/>
                  <div className="absolute inset-y-0 w-px bg-black" style={{left:((med-min)/Math.max(0.01,max-min)*100)+"%"}}/>
                </div>
                <div className="mt-1">μ̃ {med.toFixed(1)}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function PredictiveView({selectedMs, setSelectedMs}) {
  useStore();
  const id = selectedMs || MANUSCRIPTS[0].id;
  const m = MANUSCRIPTS.find(x=>x.id===id);
  const pred = predictForManuscript(id);
  const histRaw = (STATE.indicesHist[id] || []).slice(-30);
  const past = histRaw.map(h => ({ RI: h.RI_Totale }));
  const [tSet, setTSet] = useState("");
  const [rhSet, setRhSet] = useState("");
  const [luxSet, setLuxSet] = useState("");
  const [vocSet, setVocSet] = useState("");
  const [targetEnv, setTargetEnv] = useState("");
  const [whatIf, setWhatIf] = useState(null);

  const runWhatIf = () => {
    let series = getMSSeries(m).map(s => Object.assign({}, s));
    if (tSet) series.forEach(s => s.T = +tSet);
    if (rhSet) series.forEach(s => s.RH = +rhSet);
    if (luxSet) series.forEach(s => s.lux = +luxSet);
    if (vocSet) series.forEach(s => s.VOC = +vocSet);
    let weights = STATE.weights[ENVIRONMENTS.find(e=>e.id===m.ambienteId).tipo];
    if (targetEnv) {
      const te = ENVIRONMENTS.find(e=>e.id===targetEnv);
      if (te) weights = STATE.weights[te.tipo];
    }
    setWhatIf(computeForManuscript(id, weights, series));
  };

  const allHist = STATE.indicesHist[id] || [];
  const tsneData = allHist.slice(-100).map(h => ({ x: h.RI_Chimico, y: h.RI_Insetti, cluster: labelFromRI(h.RI_Totale) }));
  const currentPt = tsneData.length ? tsneData[tsneData.length-1] : null;

  return (
    <div className="space-y-6">
      <header className="flex flex-wrap items-end gap-4 justify-between">
        <div>
          <h1 className="text-2xl font-bold">Vista Predittiva</h1>
          <p className="text-sm text-slate-500">Traiettoria RI, RUT-A e simulatore what-if.</p>
        </div>
        <select className="border border-slate-300 rounded-md px-3 py-1.5 text-sm bg-white" value={id} onChange={e=>setSelectedMs(e.target.value)}>
          {MANUSCRIPTS.map(mm => <option key={mm.id} value={mm.id}>{mm.id} — {mm.nome}</option>)}
        </select>
      </header>

      <div className="rounded-xl border border-slate-200 bg-white shadow-sm p-4">
        <div className="text-sm font-semibold text-slate-700 uppercase tracking-wide mb-3">Traiettoria RI<sub>Totale</sub> — passato + 30 gg di proiezione</div>
        <TrajectoryChart past={past} future={pred.trajectory}/>
        <div className="mt-4 grid grid-cols-3 gap-3 text-sm">
          <div className="bg-slate-50 rounded-md p-3"><div className="text-xs uppercase text-slate-500">RI corrente</div><div className="text-2xl font-bold">{pred.current_RI.toFixed(1)}%</div></div>
          <div className="bg-slate-50 rounded-md p-3"><div className="text-xs uppercase text-slate-500">RI a 30 gg</div><div className="text-2xl font-bold">{pred.predicted_RI_30d.toFixed(1)}%</div></div>
          <div className="bg-amber-50 rounded-md p-3 border border-amber-200">
            <div className="text-xs uppercase text-amber-700">RUT-A</div>
            <div className="text-2xl font-bold text-amber-900">{pred.RUT_A_days >= 365 ? "—" : pred.RUT_A_days.toFixed(0) + " gg"}</div>
            {pred.RUT_A_days < 365 && <div className="text-xs text-amber-700">IC 90%: [{pred.RUT_A_lower.toFixed(0)}, {pred.RUT_A_upper.toFixed(0)}]</div>}
          </div>
        </div>
      </div>

      <div className="rounded-xl border border-slate-200 bg-white shadow-sm p-4">
        <div className="text-sm font-semibold text-slate-700 uppercase tracking-wide mb-3">Simulatore what-if</div>
        <p className="text-sm text-slate-500 mb-3">Imposta valori ipotetici per ricalcolare RI<sub>Totale</sub>. Cambiare ambiente target applica la matrice pesi del nuovo contesto.</p>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
          <Field label="T (°C)" value={tSet} setValue={setTSet}/>
          <Field label="RH (%)" value={rhSet} setValue={setRhSet}/>
          <Field label="lux" value={luxSet} setValue={setLuxSet}/>
          <Field label="VOC ppb" value={vocSet} setValue={setVocSet}/>
          <div>
            <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Sposta in ambiente</label>
            <select className="border border-slate-300 rounded-md px-2 py-1.5 text-sm w-full" value={targetEnv} onChange={e=>setTargetEnv(e.target.value)}>
              <option value="">—</option>
              {ENVIRONMENTS.map(e => <option key={e.id} value={e.id}>{e.nome}</option>)}
            </select>
          </div>
        </div>
        <div className="mt-3 flex gap-2">
          <button className="px-3 py-1.5 rounded-md bg-slate-900 text-white text-sm" onClick={runWhatIf}>Calcola</button>
          <button className="px-3 py-1.5 rounded-md bg-slate-100 text-sm" onClick={() => { setTSet(""); setRhSet(""); setLuxSet(""); setVocSet(""); setTargetEnv(""); setWhatIf(null); }}>Reset</button>
        </div>
        {whatIf && (
          <div className="mt-4 grid grid-cols-3 gap-3 text-sm">
            <div className="bg-slate-50 rounded-md p-3">
              <div className="text-xs uppercase text-slate-500">RI Totale (what-if)</div>
              <div className="text-2xl font-bold">{whatIf.RI_Totale.toFixed(1)}%</div>
              <SeverityBadge severity={whatIf.severity}/>
            </div>
            <div className="bg-slate-50 rounded-md p-3 col-span-2 text-xs grid grid-cols-2 gap-y-1">
              <div>Chimico: <strong>{whatIf.RI_Chimico.toFixed(1)}%</strong></div>
              <div>Meccanico: <strong>{whatIf.RI_Meccanico.toFixed(2)}%</strong></div>
              <div>Insetti: <strong>{whatIf.RI_Insetti.toFixed(1)}%</strong></div>
              <div>Muffa: <strong>{whatIf.RI_Muffa.toFixed(2)}%</strong></div>
              <div className="col-span-2">Foto.: <strong>ΔE* {whatIf.RI_Fotodeterioramento.toFixed(1)}</strong></div>
            </div>
          </div>
        )}
      </div>

      <div className="rounded-xl border border-slate-200 bg-white shadow-sm p-4">
        <div className="text-sm font-semibold text-slate-700 uppercase tracking-wide mb-3">Proiezione cluster diagnostici</div>
        <p className="text-xs text-slate-500 mb-2">X: RI_Chimico — Y: RI_Insetti. Triangolo nero = posizione corrente del manufatto.</p>
        <ClusterScatter points={tsneData} current={currentPt}/>
      </div>
    </div>
  );
}

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {SCENARIOS.map(s => (
          <div key={s.id} className="rounded-xl border border-slate-200 bg-white shadow-sm p-4">
            <div className="flex items-baseline justify-between">
              <div className="text-sm font-bold">Scenario {s.id} — {s.name}</div>
              <button className="px-3 py-1.5 rounded-md bg-slate-900 text-white text-sm" onClick={() => run(s)}>Avvia</button>
            </div>
            <div className="text-xs text-slate-500 mt-1">{s.envType}</div>
            <div className="mt-3 text-sm">
              <div><span className="text-slate-500 text-xs">Trigger:</span> {s.trigger}</div>
              <div><span className="text-slate-500 text-xs">Effetto:</span> {s.effect}</div>
            </div>
          </div>
        ))}
      </div>
      <div className="flex gap-2 items-center flex-wrap">
        <button className="px-3 py-1.5 rounded-md bg-slate-100 text-sm" onClick={reset}>Reset tutti gli ambienti</button>
        {msg && <span className="text-sm text-slate-600">{msg}</span>}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("collezione");
  const [selectedMs, setSelectedMs] = useState(MANUSCRIPTS[0].id);

  useEffect(() => {
    const id = setInterval(tickLive, 1000);
    return () => clearInterval(id);
  }, []);

  return (
    <div className="min-h-screen flex">
      <Sidebar view={view} setView={setView}/>
      <main className="flex-1 px-8 py-6">
        {view === "collezione" && <CollectionView setView={setView} setSelectedMs={setSelectedMs}/>}
        {view === "ambiente"   && <EnvironmentView/>}
        {view === "manufatto"  && <ManuscriptView selectedMs={selectedMs} setSelectedMs={setSelectedMs}/>}
        {view === "predittiva" && <PredictiveView selectedMs={selectedMs} setSelectedMs={setSelectedMs}/>}
        {view === "alert"      && <AlertsView/>}
        {view === "demo"       && <DemoView/>}
        {view === "linee"      && <GuidelinesView/>}
        <footer className="mt-12 pt-4 border-t border-slate-200 text-xs text-slate-500 leading-relaxed no-print">
          Sistema VoH — CeRICT — Architettura predittiva derivata da EFAISTOS (Test Before Invest, Polo P.R.I.D.E.). Sensore artunified multiparametrico.
        </footer>
      </main>
    </div>
  );
}

// Bootstrap and render
(function bootStatus(s){ const el=document.getElementById("boot-status"); if (el) el.textContent = s; })("Generazione storico simulato (30 giorni × 4 ambienti)...");

setTimeout(function() {
  try {
    bootstrap();
    (function bootStatus(s){ const el=document.getElementById("boot-status"); if (el) el.textContent = s; })("Render UI...");
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
    setTimeout(function() {
      const b = document.getElementById("boot");
      if (b) b.classList.add("hidden");
    }, 100);
  } catch (e) {
    const f = document.getElementById("fatal");
    f.style.display = "block";
    f.innerHTML = "<h2 style='font-size:18px;margin-bottom:8px'>Errore durante il bootstrap</h2><pre>" + (e.stack || e.message || e) + "</pre>";
    document.getElementById("boot").classList.add("hidden");
  }
}, 50);
</script>
